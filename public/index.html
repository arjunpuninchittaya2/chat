<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app">
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-top">
          <div class="sidebar-brand-row">
            <div class="brand-dot" aria-hidden="true"></div>
            <button id="toggleSidebarBtn" class="icon-btn" title="Toggle sidebar" aria-label="Toggle sidebar">☰</button>
          </div>

          <button id="newChatBtn" class="nav-btn primary">＋ <span>New chat</span></button>
          <button class="nav-btn">⌕ <span>Search chats</span></button>

          <nav class="utility-nav">
            <button class="nav-btn">⌁ <span>Projects</span></button>
            <button class="nav-btn">⌬ <span>Codex</span></button>
            <button id="settingsBtn" class="nav-btn">⋯ <span>More</span></button>
          </nav>
        </div>

        <section class="sidebar-section gpts-section">
          <h2>GPTs</h2>
          <button class="gpt-item"><span class="avatar">🤖</span><span>AI Humanizer</span></button>
          <button class="gpt-item"><span class="avatar">📎</span><span>Citation and Reference Finder</span></button>
          <button class="gpt-item"><span class="avatar">⚙️</span><span>Explore GPTs</span></button>
        </section>

        <section class="sidebar-section recents-section">
          <h2>Recents</h2>
          <div id="conversationList" class="conversation-list"></div>
        </section>

        <div class="sidebar-profile">
          <div class="profile-main">
            <div class="profile-avatar">AP</div>
            <div>
              <p class="profile-name">Arjun Puninchitt...</p>
              <p class="profile-plan">Free</p>
            </div>
          </div>
          <button class="upgrade-btn">Upgrade</button>
        </div>
      </aside>

      <main class="chat-main">
        <header class="chat-header">
          <div class="header-left">
            <label for="modelSelect" class="model-label">ChatGPT</label>
            <select id="modelSelect" class="model-select" aria-label="Model"></select>
          </div>
          <div class="header-actions">
            <button class="header-btn">✦ Get Plus</button>
            <button class="header-btn">⇪ Share</button>
            <button class="header-btn icon-only">⋯</button>
          </div>
        </header>

        <section id="messages" class="messages"></section>
        <button id="scrollBottomBtn" class="scroll-bottom-btn" aria-label="Scroll to bottom">↓</button>

        <div id="draftPreview" class="draft-preview" hidden>
          <p id="draftPreviewText"></p>
        </div>

        <div class="composer-container">
          <form id="composer" class="composer">
            <div id="attachmentPreview" class="attachments-display"></div>
            <div class="composer-input-wrapper">
              <label class="file-input-label" title="Add attachment" aria-label="Add attachment">
                ＋
                <input id="fileInput" type="file" multiple accept="image/*,.pdf,.txt,.md,.csv,.json,.doc,.docx" />
              </label>
              <textarea id="promptInput" placeholder="Ask anything" required></textarea>
              <div class="composer-right-actions">
                <button type="button" class="icon-btn" title="Voice input" aria-label="Voice input">🎙</button>
                <button type="button" class="icon-btn" title="Voice mode" aria-label="Voice mode">◉</button>
                <button type="submit" class="send-button" aria-label="Send">↑</button>
              </div>
            </div>
          </form>
          <p class="footer-text">ChatGPT can make mistakes. Check important info. See <a href="#" rel="noreferrer">Your privacy choices</a>.</p>
        </div>
      </main>
    </div>

    <dialog id="settingsDialog">
      <form method="dialog" id="settingsForm">
        <h2>Settings</h2>
        <label>API Base URL <input id="baseUrlInput" type="url" placeholder="https://ai.hackclub.com/proxy/v1" required /></label>
        <label>API Key <input id="apiKeyInput" type="password" placeholder="sk-..." /></label>
        <label>Search API Key <input id="searchApiKeyInput" type="password" placeholder="sk-hc-v1-..." /></label>
        <label class="checkbox-inline"><input id="webSearchToggle" type="checkbox" /> Enable Web Search</label>
        <label class="checkbox-inline"><input id="darkModeToggle" type="checkbox" /> Dark mode</label>
        <label class="checkbox-inline"><input id="reasoningToggle" type="checkbox" /> Show reasoning blocks</label>
        <div class="dialog-actions">
          <button value="cancel">Cancel</button>
          <button id="saveSettingsBtn" value="default" class="primary">Save</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/app.js"></script>
  </body>
</html>
